name: Publish Estuary releases

# Pages must finish successfully before a skin release is published.
on:
  workflow_run:
    workflows: ["Deploy Kodi repository"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: estuary-auto-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PAGES_ROOT: https://raffe1234.github.io/mypicsdb3/repository
      PUBLISHED_SHA: ${{ github.event.workflow_run.head_sha }}
      PAGES_RUN: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Check out exactly the deployed revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify published ZIPs and create independent skin releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          for channel in omega piers; do
            ref=$(jq -er --arg c "$channel" '.channels[$c].releases[0].ref' contrib/estuary/upstream.json)
            version=$(jq -er --arg c "$channel" '.channels[$c].releases[0].skin_version' contrib/estuary/upstream.json)
            revision=$(jq -er --arg c "$channel" '.channels[$c].patch_revision' contrib/estuary/upstream.json)
            tag="estuary-${channel}-${ref}-r${revision}"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists; skipping."
              continue
            fi

            dir="release-assets/${channel}"
            mkdir -p "$dir"
            url="${PAGES_ROOT}/${channel}"
            file="skin.estuary.mypicsdb3-${version}.zip"

            # Do not release stale packages if Pages was not actually updated.
            curl -fLsS --retry 8 --retry-delay 5 --retry-all-errors \
              -o "$dir/addons.xml" "$url/addons.xml"
            live_version=$(sed -n '/<addon id="skin.estuary.mypicsdb3"/s/.*version="\([^"]*\)".*/\1/p' "$dir/addons.xml")
            if [ "$live_version" != "$version" ]; then
              echo "ERROR: $channel has published '$live_version', expected '$version'" >&2
              exit 1
            fi

            curl -fLsS --retry 8 --retry-delay 5 --retry-all-errors \
              -o "$dir/$file" "$url/skin.estuary.mypicsdb3/$file"
            curl -fLsS --retry 8 --retry-delay 5 --retry-all-errors \
              -o "$dir/$file.sha256" "$url/skin.estuary.mypicsdb3/$file.sha256"
            expected=$(tr -d '\r\n[:space:]' < "$dir/$file.sha256")
            actual=$(sha256sum "$dir/$file" | cut -d ' ' -f 1)
            if [ "$expected" != "$actual" ]; then
              echo "ERROR: SHA-256 mismatch for $file" >&2
              exit 1
            fi

            options=()
            if [[ "$version" == *'~'* ]]; then
              options+=(--prerelease)
            fi
            printf 'Patched Estuary for Kodi %s.\nOfficial upstream: %s\nSkin version: %s\nVerified deployment: %s\n' \
              "$channel" "$ref" "$version" "$PAGES_RUN" > "$dir/notes.txt"
            gh release create "$tag" "$dir/$file" "$dir/$file.sha256" \
              --target "$PUBLISHED_SHA" \
              --title "Estuary MyPicsDB 3 $version ($channel)" \
              --notes-file "$dir/notes.txt" "${options[@]}"
          done

      - name: Report failed skin publication
        if: ${{ failure() }}
        shell: bash
        run: |
          title="Automatic Estuary release failed"
          body="A successful Pages deployment could not be verified or published as an Estuary release. Pages run: ${PAGES_RUN}. This workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ] && [ "$number" != "null" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  report_pages_failure:
    if: >-
      ${{ (github.event.workflow_run.conclusion == 'failure' ||
           github.event.workflow_run.conclusion == 'timed_out') &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PAGES_RUN: ${{ github.event.workflow_run.html_url }}
    steps:
      - name: Report failed Pages deployment
        shell: bash
        run: |
          title="Kodi repository deployment failed"
          body="GitHub Pages did not deploy successfully. No new Estuary release was created. Check: ${PAGES_RUN}"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$number" ] && [ "$number" != "null" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
